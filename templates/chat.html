{% extends "base.html" %}

{% block title %}Chat — AI Career Connect{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row">
        <div class="col-lg-8 mx-auto">
            <div class="card chat-card">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0"><i class="bi bi-chat-dots me-2"></i>Career Chat</h5>
                    <button class="btn btn-sm btn-outline-light" id="btn-voice">
                        <i class="bi bi-mic"></i> Voice Input
                    </button>
                </div>
                <div class="card-body chat-body" id="chat-messages">
                    <div class="text-center text-muted py-5">
                        <i class="bi bi-robot display-1"></i>
                        <p class="mt-3">Ask me anything about your career!</p>
                    </div>
                </div>
                <div class="card-footer">
                    <form id="chat-form" class="d-flex gap-2">
                        <input type="text" id="chat-input" class="form-control" 
                               placeholder="Type your career question..." autocomplete="off">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-send"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/chat.js') }}"></script>
{% endblock %}
