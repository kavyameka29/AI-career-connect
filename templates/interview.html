{% extends "base.html" %}

{% block title %}Interview Prep — AI Career Connect{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row">
        <div class="col-lg-8 mx-auto">
            <h2 class="mb-4"><i class="bi bi-question-circle me-2"></i>Interview Preparation</h2>
            <div class="card mb-4">
                <div class="card-body">
                    <form id="interview-form" class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label">Job Role</label>
                            <input type="text" id="job-role" class="form-control" 
                                   placeholder="e.g. Senior Python Developer">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Difficulty</label>
                            <select id="difficulty" class="form-select">
                                <option value="easy">Easy</option>
                                <option value="medium" selected>Medium</option>
                                <option value="hard">Hard</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-lightning me-1"></i> Generate Questions
                            </button>
                        </div>
                    </form>
                </div>
            </div>
            <div id="questions-output"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/interview.js') }}"></script>
{% endblock %}
