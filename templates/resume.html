{% extends "base.html" %}

{% block title %}Resume Review — AI Career Connect{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row">
        <div class="col-lg-10 mx-auto">
            <h2 class="mb-4"><i class="bi bi-file-earmark-text me-2"></i>Resume Review</h2>
            <div class="row g-4">
                <div class="col-md-6">
                    <div class="card h-100">
                        <div class="card-header">Paste Your Resume</div>
                        <div class="card-body">
                            <textarea id="resume-text" class="form-control" rows="15" 
                                      placeholder="Paste your resume text here..."></textarea>
                        </div>
                        <div class="card-footer">
                            <button id="btn-analyze" class="btn btn-primary w-100">
                                <i class="bi bi-magic me-1"></i> Analyze Resume
                            </button>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card h-100">
                        <div class="card-header">AI Suggestions</div>
                        <div class="card-body" id="suggestions-output">
                            <p class="text-muted text-center py-5">
                                Suggestions will appear here after analysis.
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/resume.js') }}"></script>
{% endblock %}
